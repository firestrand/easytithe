name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.22'
          python-version: '3.14.8'
      - run: uv sync --locked --group dev
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check .
      - run: uv run --locked ty check
      - run: uv run --locked pytest
      - run: uv build --no-sources
      - name: Verify installed wheel outside checkout
        shell: bash
        run: |
          repo_dir="$PWD"
          artifact_dir="$(mktemp -d)"
          trap 'rm -rf -- "$artifact_dir"' EXIT
          uv venv --python 3.14.8 "$artifact_dir/venv"
          uv pip install --python "$artifact_dir/venv/bin/python" "$repo_dir"/dist/*.whl
          cd "$artifact_dir"
          "$artifact_dir/venv/bin/python" -c 'from easytithe import EasyTithe; assert EasyTithe'
          uv pip install --python "$artifact_dir/venv/bin/python" --reinstall "$repo_dir"/dist/*.tar.gz
          "$artifact_dir/venv/bin/python" -c 'from easytithe import EasyTithe; assert EasyTithe'
