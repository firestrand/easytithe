[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "easytithe"
version = "2.0.0"
description = "Python 3 client for EasyTithe Manager exports"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["requests>=2.34.2,<3"]

[project.urls]
Repository = "https://github.com/firestrand/easytithe"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.10", "ty==0.0.84", "types-requests==2.33.0.20260906"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easytithe = ["py.typed"]

[tool.uv]
required-version = "==0.12.22"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PTH", "ASYNC"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
